<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cycle Clock</title>
<meta name="theme-color" content="#EEF1F8">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cycle Clock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<style>
:root{
  color-scheme: light;
  --bg:#EEF1F8;
  --card:#FFFFFF; --soft:#F4F6FB; --soft-2:#E8ECF5; --line:#E2E6EF; --line-2:#D3D9E6;
  --ink:#141A31; --ink-2:#3E4767; --muted:#646D8A;
  --night:#3D4FD8; --sky:#7A9BFF; --sky-soft:#E6ECFF;
  --sun:#E04E2A; --sun-soft:#FFECE5; --sun-ink:#B53A1A;
  --good:#12855A; --good-soft:#E1F4EB; --warn:#D23A40; --warn-soft:#FDEBEC; --ok:#A6600B; --ok-soft:#FCF0DE;
  --shadow:0 1px 2px rgba(20,26,49,.05), 0 12px 32px -10px rgba(20,26,49,.16);
  --shadow-s:0 1px 2px rgba(20,26,49,.06);
  --f-display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif;
  --f-text: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
}
html[lang="fa"]{
  --f-display: -apple-system, BlinkMacSystemFont, system-ui, "Vazirmatn", "Noto Sans Arabic", Tahoma, sans-serif;
  --f-text: -apple-system, BlinkMacSystemFont, system-ui, "Vazirmatn", "Noto Sans Arabic", Tahoma, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 var(--f-text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  background:radial-gradient(90% 50% at 0% 0%, #DCE5FF 0%, rgba(220,229,255,0) 70%), radial-gradient(80% 45% at 100% 0%, #FFE6DA 0%, rgba(255,230,218,0) 70%), var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--night);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));padding-block:8px 32px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px}
.brand{display:flex;align-items:center;gap:9px;font:650 19px/1 var(--f-display)}
.brand svg{width:26px;height:26px;flex:none}
.top-actions{display:flex;gap:8px}
.iconbtn{min-width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);display:grid;place-items:center;padding:0 10px;box-shadow:var(--shadow-s)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.lang{font:700 16px/1 -apple-system, system-ui, "Vazirmatn", "Noto Sans Arabic", Tahoma, sans-serif;color:var(--ink)}
html[lang="fa"] .iconbtn.lang{font-size:14px}

/* mode tabs */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:4px;margin-top:8px;background:var(--soft-2);border-radius:16px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-weight:600;font-size:15px;min-height:44px;border-radius:12px;padding:0 4px;transition:background .15s,color .15s,box-shadow .15s}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,49,.14)}

/* inputs */
.in{display:grid;gap:10px;padding-top:18px}
.lbl{font-size:14px;font-weight:550;color:var(--muted)}
.picker{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;gap:10px}
.step,.disp{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s)}
.step{min-height:74px;border-radius:18px;color:var(--ink-2);font:600 16px/1 var(--f-display);font-variant-numeric:tabular-nums;padding:0}
.disp{position:relative;display:flex;align-items:baseline;justify-content:center;gap:7px;min-height:74px;border-radius:20px;padding:18px 8px 0;font:650 44px/1 var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow:hidden}
.disp.long{font-size:25px;padding-top:24px;white-space:nowrap}
.disp small{font-size:17px;font-weight:650;color:var(--muted)}
.disp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;margin:0;cursor:pointer}
.step:active,.opt:active,.chips button:active,.pills button:active{transform:scale(.96)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:14.5px;font-weight:550;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-s);transition:background .15s,border-color .15s,color .15s}
.chips button.on,.chips button[aria-pressed="true"]{background:var(--sun-soft);border-color:#F3A58F;color:var(--sun-ink)}
.chips.fit{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.chips.fit button{padding:0 4px;font-size:14px}
.pills.full{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.pills.full button{padding:0 4px;min-height:40px}
.assume{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:14px;padding:0;border:0;background:none;color:var(--muted);font-size:13.5px;text-align:start;line-height:1.4}
.assume .link{color:var(--night);font-weight:600}

/* result card */
.result{position:relative;margin-top:20px;padding:22px 20px 20px;border-radius:28px;background:var(--card);box-shadow:var(--shadow);border:1px solid rgba(20,26,49,.04)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sun)}
.eyebrow.bed{color:var(--night)}
.big{display:flex;align-items:baseline;gap:10px;margin-top:6px;font:700 clamp(64px,19vw,100px)/.95 var(--f-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.big .ap{font-size:.28em;letter-spacing:0;color:var(--muted);font-weight:650}
.big.flip{animation:flip .22s ease-out}
@keyframes flip{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
.hsub{margin-top:10px;font-size:15px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.strip{display:flex;gap:3px;height:30px;margin-top:20px}
.strip::after{content:"";flex:none;align-self:center;width:12px;height:12px;margin-inline-start:4px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.blk{display:grid;place-items:center;min-width:3px;border-radius:8px;font:650 11px/1 var(--f-text);font-style:normal;color:#fff;overflow:hidden}
.blk.lat{background:repeating-linear-gradient(135deg, var(--soft-2) 0 4px, var(--card) 4px 8px);box-shadow:inset 0 0 0 1px var(--line)}
.blk.nap{background:var(--sky-soft);color:var(--night)}
.blk.part{background:repeating-linear-gradient(135deg, var(--warn-soft) 0 4px, var(--card) 4px 8px);box-shadow:inset 0 0 0 1.5px var(--warn)}
.axis{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.verdict{display:flex;gap:9px;margin:14px 0 0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.verdict::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;margin-top:6px;background:var(--good)}
.verdict.ok::before{background:var(--ok)}
.verdict.warn::before{background:var(--warn)}
.note{display:grid;gap:10px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--sky-soft);color:var(--ink-2);font-size:14px;line-height:1.5}
.note b{color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:6px 18px;border-radius:18px;border:1px solid transparent;font-size:17px;font-weight:650;text-decoration:none;font-variant-numeric:tabular-nums;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn svg{width:21px;height:21px;flex:none}
.btn.primary{background:var(--sun);color:#fff;box-shadow:0 10px 22px -10px rgba(224,78,42,.7)}
.btn.ghost{background:var(--card);border-color:var(--line-2);color:var(--ink)}
.btn.small{min-height:46px;font-size:15px;border-radius:14px}
.btn.tiny{min-height:38px;padding:0 12px;font-size:14px;border-radius:12px}
.btxt{display:grid;justify-items:center;line-height:1.2}
.btxt small{font-size:12.5px;font-weight:550;opacity:.92}
#alarmBtn{width:100%;margin-top:18px}
.rem{display:grid;gap:10px;margin-top:16px}
.remrow{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.remlbl{font-size:14.5px;font-weight:550;color:var(--ink-2)}
.pills{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:12px;background:var(--soft-2)}
.pills button{min-width:40px;min-height:34px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.pills button[aria-pressed="true"]{background:var(--card);color:var(--sun-ink);box-shadow:0 1px 3px rgba(20,26,49,.14)}
.remtimes{margin:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ring{display:grid;gap:10px;margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--soft)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.checks li{position:relative;padding-inline-start:18px;font-size:14px;line-height:1.5;color:var(--ink-2)}
.checks li::before{content:"";position:absolute;inset-inline-start:0;top:7px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.checks li.ok::before{background:var(--ok)}
.checks li.warn::before{background:var(--warn)}
.checks b{color:var(--ink)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* other times */
.h2{margin:26px 2px 10px;font-size:14px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{display:grid;gap:5px;justify-items:start;align-content:start;text-align:start;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-s);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.opt-time{font:650 26px/1.05 var(--f-display);letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt-time small{margin-inline-start:4px;font-size:13px;font-weight:650;color:var(--muted)}
.opt-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.g3 .opt{padding:12px 11px}
.g3 .opt-time{font-size:21px}
.g3 .opt-meta{font-size:12px}
.tag{padding:3px 8px;border-radius:7px;font-size:11px;font-weight:650;line-height:1.4;white-space:nowrap;background:var(--soft-2);color:var(--ink-2)}
.tag.best{background:var(--sun);color:#fff}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.short{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--warn-soft);color:var(--warn)}
.tag.nap{background:var(--sky-soft);color:var(--night)}
.tag.passed{color:var(--muted)}
.opt.sel{border-color:var(--sun);box-shadow:inset 0 0 0 1px var(--sun), var(--shadow-s)}
.opt.past{opacity:.55}
.cap{margin:16px 2px 0;font-size:12.5px;line-height:1.5;color:var(--muted)}

@media (min-width: 880px){
  .app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"ctl result" "side result";column-gap:28px;align-items:start}
  .ctl{grid-area:ctl}.side{grid-area:side}
  .result{grid-area:result;margin-top:8px;position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}
}

/* sheets */
dialog{width:100%;max-width:560px;max-height:min(90vh, 900px);margin:auto auto 0;padding:0;border:0;border-radius:26px 26px 0 0;background:var(--card);color:var(--ink);overflow:hidden;box-shadow:0 -10px 40px rgba(20,26,49,.18)}
dialog::backdrop{background:rgba(20,26,49,.32);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog[open]{animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
@media (min-width: 640px){ dialog{margin:auto;border-radius:26px} }
.sh{max-height:min(90vh, 900px);overflow-y:auto;overscroll-behavior:contain;padding:20px 20px calc(24px + env(safe-area-inset-bottom, 0px))}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
.sh-head h2{margin:0;font:650 22px/1.2 var(--f-display);text-wrap:balance}
.sec{display:grid;gap:12px;padding-block:18px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:10px}
.sec h3{margin:0;font-size:16px;font-weight:650}
.sec h4{margin:4px 0 0;font-size:14px;font-weight:650;color:var(--ink-2)}
.hint{margin:0;font-size:13px;line-height:1.5;color:var(--muted)}
.p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:15px;color:var(--ink-2)}
.tinput{max-width:190px;min-height:42px;padding:8px 10px;border:1px solid var(--line-2);border-radius:12px;background:var(--soft);font-size:16px;color:var(--ink)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:15px;line-height:1.45;color:var(--ink-2)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--sun-soft);color:var(--sun-ink);font:700 13px var(--f-text)}
html[lang="fa"] .steps li::before{content:counter(s, persian);font-size:14px}
.steps b,.tip b{color:var(--ink);font-weight:650}
.tip{margin:0;padding:12px 14px;border-radius:14px;background:var(--ok-soft);color:#5E4310;font-size:14px;line-height:1.5}
.actions{display:grid;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:10;max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%, 16px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%, 0)}

/* Persian: Arabic script is never letter-spaced; a touch more leading reads better */
html[lang="fa"] *{letter-spacing:0!important}
html[lang="fa"] .eyebrow{font-size:14px}
html[lang="fa"] .tag{font-size:12px}
html[lang="fa"] .verdict, html[lang="fa"] .note, html[lang="fa"] .hint, html[lang="fa"] .cap, html[lang="fa"] .p,
html[lang="fa"] .steps li, html[lang="fa"] .checks li, html[lang="fa"] .tip, html[lang="fa"] .assume{line-height:1.8}
html[lang="fa"] .big .ap{font-size:.26em}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="19.5" cy="7" r="3" fill="#E04E2A"/><path d="M20.4 15.6A8.4 8.4 0 0 1 10.4 5.6a8.4 8.4 0 1 0 10 10z" fill="#3D4FD8"/></svg>
      <span data-t="brand">Cycle Clock</span>
    </div>
    <div class="top-actions">
      <button class="iconbtn lang" id="langBtn" type="button" data-t="langBtn" data-ta="langAria">فا</button>
      <button class="iconbtn" id="openSettings" type="button" data-ta="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main class="app">
    <section class="ctl">
      <div class="seg" role="tablist">
        <button type="button" role="tab" data-mode="wake" data-t="modeWake" aria-selected="true">Wake up at</button>
        <button type="button" role="tab" data-mode="now" data-t="modeNow" aria-selected="false">Sleep now</button>
        <button type="button" role="tab" data-mode="for" data-t="modeFor" aria-selected="false">Sleep for</button>
      </div>

      <div class="in" data-mode="wake">
        <div class="lbl" data-t="lblWake">I want to wake up at</div>
        <div class="picker">
          <button class="step" type="button" data-wstep="-15" data-ta="earlier">−15</button>
          <label class="disp" for="wakeInput"><span id="wTime">6:30</span><small id="wAp">AM</small>
            <input type="time" id="wakeInput" value="06:30" data-ta="wakeAria">
          </label>
          <button class="step" type="button" data-wstep="15" data-ta="later">+15</button>
        </div>
      </div>

      <div class="in" data-mode="now" hidden>
        <div class="lbl" data-t="lblNow">Going to bed</div>
        <div class="chips">
          <button type="button" data-delay="0" data-t="d0">Now</button>
          <button type="button" data-delay="10" data-t="d10">in 10 min</button>
          <button type="button" data-delay="20" data-t="d20">in 20 min</button>
          <button type="button" data-delay="30" data-t="d30">in 30 min</button>
        </div>
      </div>

      <div class="in" data-mode="for" hidden>
        <div class="lbl" data-t="lblFor">I want to sleep for</div>
        <div class="picker">
          <button class="step" type="button" data-dstep="-15" data-ta="less">−15</button>
          <div class="disp" id="dDisp"><span id="dTime">7h 30m</span></div>
          <button class="step" type="button" data-dstep="15" data-ta="more">+15</button>
        </div>
        <div class="chips fit" id="durChips"></div>
      </div>

      <button class="assume" type="button" id="assumeBtn"><span id="assumeTxt"></span><span class="link" data-t="change">Change</span></button>
    </section>

    <section class="result" aria-live="polite">
      <div class="eyebrow" id="hEye"></div>
      <div class="big" id="hBig"><span id="hTime">--:--</span><span class="ap" id="hAp"></span></div>
      <div class="hsub" id="hSub"></div>
      <div class="strip" id="strip" role="img" data-ta="stripAria"></div>
      <div class="axis"><span id="axStart"></span><span id="axEnd"></span></div>
      <p class="verdict" id="hVerdict" hidden></p>
      <div class="note" id="note" hidden></div>
      <button class="btn primary" type="button" id="alarmBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.6 1.8H4.4z"/><path d="M10 21a2.2 2.2 0 0 0 4 0"/></svg>
        <span class="btxt"><span id="alarmLbl"></span><small id="alarmSub" hidden></small></span>
      </button>
      <div class="rem">
        <div class="remrow"><span class="remlbl" data-t="remTitle">Reminders</span><div class="pills" id="remCount"></div></div>
        <div class="remrow" id="remEveryRow" hidden><span class="remlbl" data-t="every">Every</span><div class="pills" id="remEvery"></div></div>
        <p class="remtimes" id="remTimes" hidden></p>
      </div>
      <div class="ring" id="ring" hidden></div>
    </section>

    <section class="side">
      <h2 class="h2" id="optsTitle"></h2>
      <div class="grid" id="opts"></div>
      <p class="cap" data-t="cap"></p>
    </section>
  </main>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sh">
    <div class="sh-head"><h2 id="sheetTitle" data-t="settings">Settings</h2>
      <button class="iconbtn" type="button" data-close data-ta="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <section class="sec">
      <h3 data-t="secFall">Time to fall asleep</h3>
      <div class="pills full" id="latChips" style="--n:6"></div>
      <p class="hint" data-t="hintFall"></p>
    </section>
    <section class="sec">
      <h3 data-t="secCycle">Sleep cycle length</h3>
      <div class="pills full" id="cycChips" style="--n:5"></div>
      <p class="hint" data-t="hintCycle"></p>
    </section>
    <section class="sec">
      <h3 data-t="secAlarm">Alarms</h3>
      <p class="p" id="scStatus" data-plat="ios other"></p>

/* ---------- time helpers ---------- */
const H12 = (() => {

function tp(d) {

}
const ft = d => { const p = tp(d); return p.ap ? p.t + ' ' + p.ap : p.t; };

/* ---------- calculations ---------- */
const TAGCLS = { best: 'best', good: 'good', short: 'short', tooShort: 'bad', passed: 'passed', nap: 'nap', yourPick: '', fullCycles: 'good', powerNap: 'nap' };
function tagFor(n, isBest) { return isBest ? 'best' : n >= 5 ? 'good' : n === 4 ? 'short' : n === 1 ? 'nap' : 'tooShort'; }

function calcWake(now) {
  const C = S.cycle, lat = S.base;
  const wake = new Date(now), w = hm(S.wake);
  wake.setHours(Math.floor(w / 60), w % 60, 0, 0);
  if (wake <= now) wake.setDate(wake.getDate() + 1);
  const all = [];
  for (let n = 6; n >= 1; n--) {
    const sleepStart = addMin(wake, -n * C), lightsOut = addMin(sleepStart, -lat);
    all.push({ key: 'w' + n, n, asleep: n * C, lightsOut, sleepStart, wake, past: lightsOut < now, show: n >= 3 });
  }
  if (!all.some(o => o.show && !o.past)) all.forEach(o => { if (o.n < 3) o.show = true; });
  const opts = all.filter(o => o.show);
  const best = [5, 6, 4, 3, 2, 1].map(n => opts.find(o => o.n === n && !o.past)).find(Boolean) || null;
  opts.forEach(o => { o.tag = o.past ? 'passed' : tagFor(o.n, o === best); });
  let note = null;
  const five = all.find(o => o.n === 5);
  if (five.past) {
    const wNow = addMin(now, lat + 5 * C), diff = (wNow - wake) / MIN;
    if (diff >= -20 && diff <= 30) note = { html: T('noteShift', ft(five.lightsOut), ft(wNow)), alarm: wNow };
    else if (!best) note = { html: T('noteNone', ft(wake)) };

}

function calcNow(now) {
  const C = S.cycle, lightsOut = addMin(now, S.delay), sleepStart = addMin(lightsOut, S.base);
  const opts = [1, 2, 3, 4, 5, 6].map(n => ({ key: 'n' + n, n, asleep: n * C, lightsOut, sleepStart, wake: addMin(sleepStart, n * C) }));
  const best = opts[4];

}

function calcFor(now) {
  const C = S.cycle, d = S.dur, lightsOut = now, sleepStart = addMin(now, S.base);
  const mk = (m, x) => Object.assign({ key: 'm' + m, n: Math.round(m / C), asleep: m, lightsOut, sleepStart, wake: addMin(sleepStart, m) }, x);
  const napV = { cls: 'good', text: T('napV') };

  const lo = Math.floor(d / C) * C, hi = Math.ceil(d / C) * C;

  if (d <= 30) verdict = { cls: 'good', text: T('powerNap') + T('napV') };
  else if (d < C - 15) verdict = { cls: 'warn', text: T('vDeep', fd(C)) };
  else if (toEnd <= 10) { aligned = true; verdict = { cls: 'good', text: T('vAligned', nearN) }; }
  else if (toEnd <= 20) verdict = { cls: 'ok', text: T('vClose', nearN, fd(nearN * C)) };
  else verdict = { cls: 'warn', text: T('vMid', Math.floor(d / C) + 1, fd(lo), fd(hi)) };
  const exact = mk(d, { key: 'x', exact: true, aligned, nap: d <= 30, verdict, n: aligned ? nearN : 0, tag: 'yourPick' });
  const opts = [exact];
  const add = (m, x) => { if (m > 0 && m <= 720 && !opts.some(o => o.asleep === m)) opts.push(mk(m, x)); };
  const napX = { nap: true, verdict: napV, tag: 'powerNap' };
  const full = m => ({ aligned: true, verdict: { cls: 'good', text: T('vAligned', Math.round(m / C)) }, tag: 'fullCycles' });

  else if (d < C - 15) { add(20, napX); add(C, full(C)); }

    if (nearN * C !== d) add(nearN * C, full(nearN * C));
    if (opts.length < 3) add((nearN - 1) * C, full((nearN - 1) * C));
    if (opts.length < 3) add((nearN + 1) * C, full((nearN + 1) * C));

}

function renderAlarmSheet() {
  const l = pending;
  $('#alarmTitle').textContent = T(PLATFORM === 'android' ? 'androidTitle' : PLATFORM === 'native' ? 'noClockTitle' : 'alarmTitle');
  $('#st5').innerHTML = T('st5', esc(S.scName));
  $('#scDoneLbl').textContent = !l ? T('scDone') : l.length > 1 ? T('scDoneN', l.length) : T('scDoneFor', ft(l[0].at));
  $('#copyTime').hidden = !l;
  if (l) $('#copyLbl').textContent = T('copy', l.map(x => ft(x.at)).join(T('listSep')));
  faDigits($('#alarmSheet'));
}
function openAlarmSheet(list) { pending = list && list.length ? list : null; renderAlarmSheet(); openSheet($('#alarmSheet')); }

/* ---------- alarms: one tap sends each alarm exactly once ---------- */
function runAlarms(list) {
  if (!list || !list.length) return;
  list = list.slice().sort((a, b) => a.at - b.at);
  if (Date.now() - lastRun < 4000) return; // ignore a second tap while the first is still being handled
  if (NATIVE) { lastRun = Date.now(); nativeAlarms(list); return; }
  if (PLATFORM === 'android' || !S.scReady || (list.length > 1 && !S.scV2)) { openAlarmSheet(list); return; }
  lastRun = Date.now();
  const url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(S.scName) +
    '&input=text&text=' + encodeURIComponent(list.map(x => hhmm(x.at)).join(','));
  toast(list.length > 1 ? T('toastAlarmN', list.length) : T('toastAlarm', ft(list[0].at)));
  setTimeout(() => { try { (window.__ccOpen || (u => { window.location.href = u; }))(url); } catch (e) {} }, 60);
}
function nativeAlarms(list) {
  let raised = false;
  const st = nativeStatus();
  if (st && volPct(st) < 40) { try { NATIVE.raiseAlarmVolume(0.7); raised = true; } catch (e) {} }
  let res = 'error';
  try {
    res = list.length === 1
      ? NATIVE.setAlarm(list[0].at.getHours(), list[0].at.getMinutes(), list[0].label)
      : NATIVE.setAlarms(JSON.stringify(list.map(x => ({ h: x.at.getHours(), m: x.at.getMinutes(), label: x.label }))));
  } catch (e) {}
  if (res === 'noclock') { lastRun = 0; openAlarmSheet(list); return; }
  if (res !== 'ok') { lastRun = 0; toast(T('alarmFailed')); return; }
  toast((list.length > 1 ? T('alarmSetN', list.length) : T('alarmSet', ft(list[0].at))) + (raised ? ' ' + T('volUp') : ''));
  ringInfo = { list: list.map(x => x.at), next: -1 };
  setTimeout(verifyAlarm, 1500);
}
function verifyAlarm() {
  if (!NATIVE || !ringInfo) return;
  try { ringInfo.next = +NATIVE.nextAlarm(); } catch (e) { ringInfo.next = -1; }
  renderRing();
}
function renderRing() {
  const el = $('#ring'), r = ringInfo;
  if (!NATIVE || !r || r.list[r.list.length - 1].getTime() < Date.now() - 60000) { el.hidden = true; return; }
  const st = nativeStatus(), nd = r.next > 0 ? new Date(r.next) : null;
  const match = nd && r.list.some(d => d.getHours() === nd.getHours() && d.getMinutes() === nd.getMinutes());
  let li, clock = false;
  if (match) li = `<li>${T('rcConfirmed', ft(nd))}</li>`;
  else if (nd && nd < r.list[0]) { li = `<li class="ok">${T('rcEarlier', ft(nd))}</li>`; clock = true; }
  else { li = `<li class="warn">${T('rcUnknown')}</li>`; clock = true; }
  el.innerHTML = `<ul class="checks">${li}${statusLis(st)}</ul>` + fixBtns(st, clock);
  el.hidden = false;
  faDigits(el);
}
window.onNativeResume = () => { render(); if (ringInfo) verifyAlarm(); };
window.onNativeBack = () => {
  const open = $$('dialog').filter(x => x.open);
  if (open.length) { closeSheet(open[open.length - 1]); return true; }
  return false;
};

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; faDigits(t); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function copyText(txt) {
  const ok = () => toast(T('copied', txt));
  try { navigator.clipboard.writeText(txt).then(ok, () => fallbackCopy(txt, ok)); } catch (e) { fallbackCopy(txt, ok); }
}
function fallbackCopy(txt, ok) {
  const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); ok(); } catch (e) { toast(txt); }
  ta.remove();
}

/* ---------- events ---------- */
const commit = () => { save(); render(); };
document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) return;
  const ds = t.dataset;
  if (t.hasAttribute('data-close')) { closeSheet(t.closest('dialog')); return; }
  if (ds.mode) { S.mode = ds.mode; commit(); return; }
  if (ds.wstep) { S.wake = hmStr(hm(S.wake) + +ds.wstep); sel.wake = null; commit(); return; }
  if (ds.delay !== undefined) { S.delay = +ds.delay; sel.now = null; commit(); return; }
  if (ds.dstep) { S.dur = clamp(S.dur + +ds.dstep, 10, 720); sel.for = null; commit(); return; }
  if (ds.dur) { S.dur = +ds.dur; sel.for = null; commit(); return; }
  if (ds.k) { sel[S.mode] = ds.k; render(); return; }
  if (ds.rem !== undefined) { S.rem = +ds.rem; commit(); return; }
  if (ds.every) { S.remEvery = +ds.every; commit(); return; }
  if (ds.lat !== undefined) { S.base = +ds.lat; commit(); return; }
  if (ds.cyc) { S.cycle = +ds.cyc; sel.wake = sel.now = sel.for = null; commit(); return; }
  if (ds.alarm) { runAlarms([{ at: new Date(+ds.alarm), label: T('alarmLabel') }]); return; }
  if (ds.act && NATIVE) {
    if (ds.act === 'raise') { try { NATIVE.raiseAlarmVolume(0.7); } catch (err) {} toast(T('volRaised')); }
    if (ds.act === 'dnd') { try { NATIVE.openDnd(); } catch (err) {} }
    if (ds.act === 'clock') { try { NATIVE.openClock(); } catch (err) {} }
    renderRing(); if ($('#sheet').open) renderSheet();
    return;
  }
  switch (t.id) {
    case 'langBtn':
      S.lang = S.lang === 'fa' ? 'en' : 'fa'; save(); applyLang(); render();
      renderSheet(); renderAlarmSheet(); $('#toast').textContent = '';
      break;
    case 'openSettings': case 'assumeBtn': renderSheet(); openSheet($('#sheet')); break;
    case 'alarmBtn': if (alarmAt) runAlarms([{ at: alarmAt, label: T('alarmLabel') }].concat(remList)); break;
    case 'showSetup': case 'showAndroid': openAlarmSheet(null); break;
    case 'testAlarm': closeSheet($('#sheet')); runAlarms([{ at: addMin(nowMin(), 2), label: T('testLabel') }]); break;
    case 'scDone': {
      S.scReady = true; S.scV2 = true; save(); closeSheet($('#alarmSheet'));
      if ($('#sheet').open) renderSheet();
      const l = pending; pending = null;
      if (l) runAlarms(l); else toast(T('toastOn'));
      break;
    }
    case 'copyTime': if (pending) copyText(faStr(pending.map(x => ft(x.at)).join(T('listSep')))); break;
  }
});
$$('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) closeSheet(d); }));

const wi = $('#wakeInput');
const onWake = () => { if (wi.value && wi.value.slice(0, 5) !== S.wake) { S.wake = wi.value.slice(0, 5); sel.wake = null; commit(); } };
wi.addEventListener('input', onWake); wi.addEventListener('change', onWake);
wi.addEventListener('click', () => { try { if (wi.showPicker) wi.showPicker(); } catch (e) {} });
$('#scName').addEventListener('input', e => { S.scName = e.target.value.trim() || 'Sleep Alarm'; save(); });

setInterval(() => { if (Math.floor(Date.now() / MIN) !== lastMinute) render(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

if (PWA && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
applyPlat();
applyLang();
render();
})();
</script>

</body>
